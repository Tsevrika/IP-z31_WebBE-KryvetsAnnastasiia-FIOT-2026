<!DOCTYPE html>
<html lang="uk">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Новий пароль</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="header">
  <a class="logo" href="/">Recipe Manager</a>
  <nav class="nav" id="nav">
    <a href="/">Головна</a>
    <a href="/login" class="guest-only">Вхід</a>
    <a href="/register" class="guest-only">Реєстрація</a>
  </nav>
</header>
<main class="auth-page">
  <section class="auth-card">
    <h1>Встановити новий пароль</h1>
    <p class="auth-subtitle">Введіть новий пароль. Посилання діє 30 хвилин.</p>
    <form id="resetPasswordForm">
      <label>Новий пароль<input type="password" id="resetPassword" placeholder="Мінімум 6 символів" required></label>
      <label>Підтвердження пароля<input type="password" id="resetConfirmPassword" placeholder="Повторіть пароль" required></label>
      <button type="submit">Зберегти пароль</button>
    </form>
    <p id="authMessage" class="message"></p>
    <p class="auth-links"><a href="/login">Повернутися до входу</a></p>
  </section>
</main>
<script src="js/script.js"></script>
</body>
</html>
